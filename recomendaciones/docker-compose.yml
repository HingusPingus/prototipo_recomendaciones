# Stack local de recomendaciones, con un api-general SIMULADO (`reco-demo`). Guía: docs/demo.md.
#   cd recomendaciones
#   docker compose up --build -d
#
# Orden de arranque: infraestructura → migraciones → api-general simulada → sincronización y batch
# → API + worker → declaraciones de los usuarios de fondo.
# Los puertos se publican solo en 127.0.0.1: `/demo` no pide credenciales y reenvía con la API key interna.
# Para usar el api-general real: sacar `api-general-simulada` y `semilla-declaraciones`, y apuntar
# RECO_API_GENERAL_BASE_URL y RECO_INTERNAL_API_KEY a los valores de su entorno. Antes, `api-general` tiene
# que cerrar las diferencias con el contrato propuesto: ver «Cuando esté el api-general real» en docs/demo.md.

name: recomendaciones

x-reco-env: &reco-env
  RECO_ENVIRONMENT: demo
  # Credencial SOLO para este stack local: forma <entorno>.<secreto> (FR-059). Nunca usarla en otro entorno.
  RECO_INTERNAL_API_KEY: demo.clave-local-solo-para-la-demo
  RECO_DATABASE_URL: postgresql+psycopg://reco:reco@postgres:5432/recomendaciones
  RECO_REDIS_URL: redis://redis:6379/0
  RECO_AMQP_URL: amqp://reco:reco@rabbitmq:5672/
  RECO_API_GENERAL_BASE_URL: http://api-general-simulada:8080
  RECO_ENGINE_CONFIG_FILE: v1.yaml
  RECO_TTL_FRESH_SECONDS: "86400"
  RECO_TTL_STALE_SECONDS: "604800"
  RECO_TTL_FILTERS_SECONDS: "3600"
  RECO_TTL_FALLBACK_SECONDS: "21600"
  RECO_TTL_SUPPRESS_SECONDS: "300"
  RECO_TTL_DEDUPE_SECONDS: "86400"
  RECO_IDEMPOTENCY_RETENTION_HOURS: "168"
  RECO_SIGNAL_RETENTION_DAYS: "730"
  RECO_SYNC_VOLUME_DELTA_RATIO: "0.9"
  # Demo: cada interacción recalcula en el acto, para que el cambio se vea en vivo (producción: 10).
  RECO_INTERACTION_RECALC_THRESHOLD: "1"
  RECO_RECOMPUTE_REQUESTS_MAXLEN: "100000"
  RECO_RECOMPUTE_REQUESTS_MAX_DELIVERIES: "5"
  RECO_EVENT_REDELIVERY_WINDOW_HOURS: "24"
  RECO_RETRY_MAX_ATTEMPTS: "5"
  RECO_RETRY_BACKOFF_BASE_SECONDS: "1"
  RECO_REDIS_TIMEOUT_SECONDS: "0.5"
  RECO_API_GENERAL_TIMEOUT_SECONDS: "10"
  RECO_WARMUP_RATE_PER_SECOND: "50"
  RECO_DEMO_API_URL: http://api:8000

x-app: &app
  build: .
  image: recomendaciones:local
  environment: *reco-env

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reco
      POSTGRES_PASSWORD: reco
      POSTGRES_DB: recomendaciones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reco -d recomendaciones"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      # El usuario guest de RabbitMQ solo acepta conexiones desde localhost: se usa uno propio.
      RABBITMQ_DEFAULT_USER: reco
      RABBITMQ_DEFAULT_PASS: reco
    ports:
      - "127.0.0.1:15672:15672"  # consola web de RabbitMQ (usuario reco / reco)
    healthcheck:
      # `ping` da OK apenas arranca el nodo, antes de que el puerto AMQP acepte conexiones.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 30

  migraciones:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  api-general-simulada:
    <<: *app
    command: ["reco-demo", "api-general"]
    ports:
      - "127.0.0.1:8080:8080"  # Swagger de la demo: http://localhost:8080/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 3s
      retries: 30
    depends_on:
      rabbitmq: {condition: service_healthy}

  # Una corrida del Data Transformer real y los jobs que dejan listo el respaldo por popularidad.
  preparacion:
    <<: *app
    command: ["sh", "-c", "reco-transformer && reco-batch popularity && reco-batch fallback"]
    depends_on:
      migraciones: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      api-general-simulada: {condition: service_healthy}

  api:
    <<: *app
    command: ["reco-api"]
    ports:
      - "127.0.0.1:8000:8000"  # API de recomendaciones (requiere X-Internal-API-Key)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 3s
      retries: 30
    depends_on:
      preparacion: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["reco-worker"]
    depends_on:
      preparacion: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}

  semilla-declaraciones:
    <<: *app
    command: ["reco-demo", "semilla"]
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}

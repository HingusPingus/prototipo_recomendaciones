openapi: 3.1.0
info:
  title: RecoMe · api-general — endpoints internos consumidos por el Data Transformer
  version: 1.0.0-propuesta
  description: |
    **Propuesta** de este repositorio (prioridad de definición, RD-47) de los endpoints REST que el
    Data Transformer **consume** (FR-015). Ninguna tarea de `tasks.md` los definía —T049 cubre la API
    propia y los eventos—, y T028/T029 (Fase 1) necesitan un contrato contra el cual construirse y un
    doble contra el cual probarse. El contrato vigente será el que publique `api-general`.

    Materializa CR-1…CR-12, CR-15…CR-18 y DEP-1, DEP-2, DEP-5, DEP-7…DEP-11 (data-model.md §10).
    Solo lectura: el Data Transformer no invoca operaciones que muten estado (FR-017, Principio IV).
  x-contract-origin:
    status: propuesta-no-publicada
    drafted: "2026-09-28"
    source: specs/001-recomendaciones-precomputadas (hueco detectado en /speckit-implement)
security:
  - InternalApiKey: []
paths:
  /internal/v1/sync/users:
    get:
      operationId: listUsers
      summary: Listado paginado de usuarios (proyección)
      parameters:
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de usuarios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
  /internal/v1/sync/catalog/items:
    get:
      operationId: listCatalogItems
      summary: Listado paginado del catálogo, con marcador de completitud (CR-9)
      description: |
        Todas las páginas de una misma pasada comparten `snapshot_id` y declaran el `total` de esa
        instantánea. El listado es **completo** si y solo si se recibieron todas las páginas de un
        mismo `snapshot_id`, la última trae `next_page_token: null` y la cantidad recibida iguala a
        `total`. Si no puede confirmarse, la sincronización aborta **sin marcar retiros** (CR-9,
        FR-074). Un ítem ausente de un listado completo se interpreta como retirado (CR-8).
      parameters:
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página del catálogo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CatalogItem"
  /internal/v1/sync/activity:
    get:
      operationId: listActivity
      summary: Actividad incremental como hechos inmutables (CR-17, CR-18)
      description: |
        Devuelve interacciones cuyo `occurred_at` es posterior o igual a `since`. Cada transición de
        estado es un hecho propio con identificador nuevo (CR-18). El Data Transformer pide desde su
        marca de agua menos la ventana de reentrega; el solapamiento se deduplica por
        `origin_interaction_id` (DI-21), de modo que no hace falta persistir un cursor.
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de actividad
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Interaction"
components:
  securitySchemes:
    InternalApiKey:
      type: apiKey
      in: header
      name: X-Internal-API-Key
  parameters:
    PageToken:
      name: page_token
      in: query
      required: false
      schema:
        type: string
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
  schemas:
    PageEnvelope:
      type: object
      required: [snapshot_id, total, next_page_token]
      properties:
        snapshot_id:
          type: string
        total:
          type: integer
          minimum: 0
        next_page_token:
          type: [string, "null"]
    User:
      type: object
      required: [id, birth_date, region]
      properties:
        id:
          type: string
          format: uuid
        birth_date:
          description: Obligatoria y confiable (CR-1, CR-2, DEP-5). Sin campo `age` (CR-3)
          type: string
          format: date
        region:
          description: ISO 3166-1 alfa-2 en mayúsculas, obligatoria (CR-5, DEP-11)
          type: string
          pattern: "^[A-Z]{2}$"
    CatalogItem:
      type: object
      required: [id, module, age_rating, tags]
      properties:
        id:
          type: string
          format: uuid
        module:
          type: string
          enum: [peliculas, juegos]
        age_rating:
          description: Literal exacto del age_rating_catalog activo, incluido el `+` (CR-15)
          type: string
          enum: [ATP, "+13", "+18"]
        status:
          description: Disponibilidad y retiro explícito (CR-7, deseable no bloqueante)
          type: string
          enum: [available, retired]
        tags:
          description: Conjunto NO vacío de tags temáticos, nombres estables y sin variantes de formato (CR-10, CR-11, CR-16, DEP-7)
          type: array
          minItems: 1
          items:
            type: string
    Interaction:
      type: object
      required: [origin_interaction_id, user_id, item_id, signal_type, occurred_at]
      properties:
        origin_interaction_id:
          description: Único, estable y no reutilizado; el mismo que viaja en recomendacion.actualizar (CR-17, DEP-8)
          type: string
        user_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        signal_type:
          type: string
          enum: [like, dislike, consumo]
        occurred_at:
          description: Provisto por el origen (CR-12, DEP-2)
          type: string
          format: date-time

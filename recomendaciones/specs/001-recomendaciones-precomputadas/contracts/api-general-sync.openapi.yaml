openapi: 3.1.0
info:
  title: RecoMe · api-general — sincronización interna para recomendaciones
  version: 1.0.0-propuesta
  description: |
    Propuesta no publicada alineada con los contratos recibidos en `files/` y con
    `files/required-fields.md`. Estos artefactos son la referencia funcional para ruta,
    autenticación, paginación y forma de los registros. La implementación local se está alineando
    con esta propuesta; no representa publicación ni conformidad de despliegue. Una pasada solo es completa si todas sus páginas comparten snapshot_id,
    la última tiene next_page_token nulo y el total recibido coincide con total.
    Clasificación: conjunto nuevo/aditivo frente a los contratos publicados de api-general.
  x-change-classification: compatible-additive-new-endpoints
  x-change-reason: Reflejar los contratos recibidos y detectar listados parciales.
  x-contract-origin:
    status: propuesta-no-publicada
    drafted: "2026-09-28"
    source: specs/004-contratos-recomendaciones/spec.md
servers:
  - url: /api/v1
    description: Prefijo de contexto del host privado de api-general.
security:
  - ServiceApiKey: []
paths:
  /internal/v1/sync/users:
    get:
      operationId: listSyncUsers
      summary: Proyección paginada de usuarios
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Página de usuario; la pasada se completa al recibir todas las páginas del mismo snapshot, con next_page_token nulo y la cantidad recibida igual a total.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/sync/catalog/items:
    get:
      operationId: listSyncCatalogItems
      summary: Página de catálogo vinculada a un snapshot inmutable
      description: |
        Todas las páginas de una pasada comparten snapshot_id y total. Una lectura solo es completa
        si se obtuvieron todas las páginas del mismo snapshot, la última tiene next_page_token nulo
        y la cantidad acumulada coincide con total. Un recorrido truncado o inconsistente no permite
        marcar ausencias como retiros.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Página de catálogo dentro del snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CatalogPage'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/ExpiredCatalogSnapshot' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/sync/activity:
    get:
      operationId: listSyncActivity
      summary: Hechos de actividad incrementales, ordenados e inclusivos
      description: |
        Incluye occurred_at >= since. Orden ascendente por occurred_at y después por
        origin_interaction_id. Todas las páginas comparten snapshot_id y total; la pasada está
        completa cuando next_page_token es null y la cantidad acumulada coincide con total.
        El consumidor deduplica solapamientos por origin_interaction_id. Cada cambio de estado es
        un hecho propio; timestamps son los provistos por el origen y llevan zona horaria. Mientras
        haya estado legacy sin historial de procedencia completo, el servicio falla cerrado con 503.
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Página de hechos de actividad
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Interaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    ServiceApiKey:
      type: apiKey
      in: header
      name: X-Internal-API-Key
      description: Clave interna específica del entorno; nunca incluirla en logs.
  parameters:
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    PageToken:
      name: page_token
      in: query
      required: false
      schema: { type: string, minLength: 1 }
      description: Token opaco de continuación; ligado al recurso y, para catálogo, al snapshot.
  schemas:
    Page:
      type: object
      required: [snapshot_id, total, next_page_token]
      properties:
        snapshot_id:
          type: string
          minLength: 1
          description: Identifica el snapshot común a todas las páginas de la pasada.
        total: { type: integer, minimum: 0 }
        next_page_token: { type: [string, 'null'] }
        items: { type: array }
    CatalogPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [expires_at]
          properties:
            expires_at:
              type: string
              format: date-time
              description: Vencimiento del snapshot; constante en todas las páginas de esa pasada.
    User:
      type: object
      additionalProperties: false
      required: [id, birth_date, region]
      properties:
        id: { type: string, format: uuid }
        birth_date:
          type: string
          format: date
          description: Fecha confiable de origen; nunca se expone edad derivada.
        region:
          type: string
          pattern: '^[A-Z]{2}$'
          description: Código ISO 3166-1 alfa-2 en mayúsculas.
    CatalogItem:
      type: object
      additionalProperties: false
      required: [id, module, age_rating, tags]
      properties:
        id: { type: string, format: uuid }
        module: { type: string, enum: [peliculas, juegos] }
        age_rating: { type: string, enum: [ATP, '+13', '+18'] }
        tags:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        status:
          type: string
          enum: [available, retired]
          description: Campo deseable, no bloqueante; una ausencia solo indica retiro tras snapshot completo.
    Interaction:
      type: object
      additionalProperties: false
      required: [origin_interaction_id, user_id, item_id, module, signal_type, occurred_at]
      properties:
        origin_interaction_id:
          type: string
          minLength: 1
          description: Identificador propio estable y no reutilizado; coincide con el evento.
        user_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        module: { type: string, enum: [peliculas, juegos] }
        signal_type: { type: string, enum: [like, dislike, consumo] }
        occurred_at:
          type: string
          format: date-time
          description: Momento provisto por el origen; debe incluir zona horaria.
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
  responses:
    BadRequest:
      description: Parámetros inválidos o token de página no válido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: API key ausente, inválida o de otro entorno.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: API key reconocida pero expirada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ExpiredCatalogSnapshot:
      description: El snapshot de catálogo venció; descartar toda la pasada e iniciar una nueva.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Datos o baseline de actividad no verificables; no se entrega un listado parcial como completo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

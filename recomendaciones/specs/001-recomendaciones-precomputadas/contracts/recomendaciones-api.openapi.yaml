openapi: 3.1.0
info:
  title: RecoMe · API de Recomendaciones (interna)
  version: 1.1.0
  description: |
    Versión 1.1.0 del contrato del servicio recomendaciones, custodiado por api-general. El equipo
    proveedor reportó que la corrección RD-118 —422/503, componentes de respuesta y `/health`— se
    publicó en `main` mediante 3f4ceab y confirmó que puede copiarse textualmente. Este archivo local
    contiene esos cambios; la copia movida disponible de recomendaciones solo contiene el OpenAPI
    1.0.0 propuesto y no conserva `.git`, por lo que no se verificó paridad literal con 3f4ceab.
    La publicación inicial 83e6b59 añadió la consulta del checkpoint y el 200/401/404. Esto no
    acredita que el endpoint, la clave o la versión runtime estén desplegados en un entorno.
    Se conserva sin cambios el artefacto recibido 1.0.0 en `files/`; esta propuesta también conserva los cinco estados,
    UUID y `DeclarationRequest.tags.minItems: 1`, y documenta el mínimo efectivo configurable de cinco.
    La ruta y la respuesta del checkpoint se basan en la propuesta recibida en `checkpoint-baja.md`;
    no acreditan que el endpoint esté implementado, desplegado o aprobado para activación. La versión
    runtime y el valor efectivo de `declared_tags_min` todavía deben verificarse.
  x-change-classification: additive
  x-change-reason: Añadir la consulta autenticada del recibo de baja y conservar el contrato 1.0.0 recibido, incluida la ruta pública `/health`.
  x-contract-origin:
    status: publicado-en-main
    drafted: "2026-10-05"
    target-version: 1.1.0
    commit: 3f4ceab
    initial-commit: 83e6b59
    publication-confirmed: "2026-10-06"
    source:
      - specs/004-contratos-recomendaciones/files/recomendaciones-api.openapi.yaml
      - prototipo_recomendaciones-dev/recomendaciones/docs/contracts/checkpoint-baja.md (reviewed at dev commit 199cdf7; local copy has no Git metadata)
servers:
  - url: http://recomendaciones.internal
    description: Solo alcanzable por servicios internos
security:
  - InternalApiKey: []
paths:
  /internal/v1/recommendations/{user_id}:
    get:
      operationId: getRecommendations
      summary: Leer el resultado precomputado de recomendaciones de un módulo
      description: Sin paginación; top_n es el único parámetro de tamaño. La solicitud requiere que el usuario haya declarado gustos para el módulo (412 si falta).
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: module
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Module' }
        - name: top_n
          in: query
          required: false
          schema: { type: integer, minimum: 10, maximum: 50, default: 20 }
        - name: prefer
          in: query
          required: false
          schema: { type: string, enum: [stale] }
      responses:
        '200':
          description: Recomendaciones y estado explícito del resultado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnknownUser' }
        '412': { $ref: '#/components/responses/DeclarationRequired' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/declarations/{user_id}:
    post:
      operationId: declareTastes
      summary: Registrar una declaración definitiva de gustos para un módulo
      description: Valida al menos cinco tags propios del vocabulario vigente. Una declaración existente no se reemplaza.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeclarationRequest' }
      responses:
        '201':
          description: Declaración persistida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeclarationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnknownUser' }
        '409': { $ref: '#/components/responses/DeclarationConflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/deletion-receipts/{event_id}:
    get:
      operationId: getDeletionReceipt
      summary: Consultar el checkpoint de recepción de una baja
      description: >-
        Devuelve el recibo durable asociado al evento de baja. La respuesta no incluye datos del usuario.
        Un event_id que no sea UUID produce 422. Un 404 con cuerpo Error y código receipt_not_found
        indica que todavía no hay un checkpoint registrado; la aceptación del mensaje por el broker no
        equivale a este checkpoint. Un 503 con código receipts_unavailable y Retry-After indica que la
        base no responde; el cliente debe reintentar.
      security:
        - InternalApiKey: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Recibo de recepción durable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ReceiptNotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /health/live:
    get:
      operationId: liveness
      security: []
      responses:
        '200':
          description: Proceso vivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /health/ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200':
          description: Dependencias críticas disponibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: No listo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /health:
    get:
      operationId: health
      security: []
      summary: Estado y versión de configuración activa
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
components:
  securitySchemes:
    InternalApiKey:
      type: apiKey
      in: header
      name: X-Internal-API-Key
      description: Clave interna normal de recomendaciones, específica del entorno (`RECO_INTERNAL_API_KEY`).
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Module: { type: string, enum: [peliculas, juegos] }
    ResultType:
      type: string
      description: Estados cerrados y exhaustivos; agregar otro exige versionado compatible.
      enum: [empty_pending, empty_no_candidates, fallback, personalized_stale, personalized]
    RecommendationItem:
      type: object
      additionalProperties: false
      required: [item_id, position, score, config_version]
      properties:
        item_id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        score: { type: number }
        config_version: { type: string }
    RecommendationResponse:
      type: object
      additionalProperties: false
      required: [user_id, module, result_type, computed_at, config_version, stale_available, items]
      properties:
        user_id: { type: string, format: uuid }
        module: { $ref: '#/components/schemas/Module' }
        result_type: { $ref: '#/components/schemas/ResultType' }
        computed_at: { type: [string, 'null'], format: date-time }
        config_version: { type: string }
        stale_available: { type: boolean }
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/RecommendationItem' }
    DeclarationRequest:
      type: object
      additionalProperties: false
      required: [module, tags]
      properties:
        module: { $ref: '#/components/schemas/Module' }
        tags:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
          description: Tags propios, distintos y no vacíos. El servicio aplica declared_tags_min (5).
    DeclarationResponse:
      type: object
      additionalProperties: false
      required: [user_id, module, declared_tags, inherited_tags]
      properties:
        user_id: { type: string, format: uuid }
        module: { $ref: '#/components/schemas/Module' }
        declared_tags: { type: array, items: { type: string } }
        inherited_tags: { type: array, items: { type: string } }
    DeletionReceipt:
      type: object
      additionalProperties: false
      required: [event_id, received_at, suppression_state]
      properties:
        event_id: { type: string, format: uuid, description: Identificador del evento de baja consultado. }
        received_at: { type: string, format: date-time, description: Instante en que se registró el checkpoint durable. }
        suppression_state:
          type: string
          enum: [in_progress, completed, failed]
          description: Estado de supresión asociado al checkpoint.
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum: [unauthorized, invalid_request, unknown_user, declaration_required, declaration_already_exists, cache_unavailable, filters_unavailable, receipt_not_found, receipts_unavailable, internal_error]
        message: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        component: { type: string }
        config_version: { type: string }
        checks: { type: object, additionalProperties: { type: string } }
  responses:
    Unauthorized:
      description: Credencial ausente, inválida o de otro entorno
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnknownUser:
      description: Usuario no reconocido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DeclarationRequired:
      description: Falta declaración de gustos para el módulo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DeclarationConflict:
      description: La declaración definitiva ya existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ReceiptNotFound:
      description: No hay recepción registrada para ese `event_id` (todavía no llegó, o no es un evento de baja)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: Parámetros inválidos (módulo, `top_n` fuera de `[10, 50]`, `limit`/`cursor`, tags insuficientes o fuera del vocabulario)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Redis caído (≠ miss) o filtros no disponibles; reintentable (FR-050, FR-065)
      headers:
        Retry-After:
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

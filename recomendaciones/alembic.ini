# Alembic — migraciones de DB Recomendaciones (T003). Toda migración es reversible y probada
# (constitución, Flujo de Desarrollo; data-model.md §7.4: expand → migrate → contract).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# La URL real viene de RECO_DATABASE_URL (migrations/env.py); nunca se versiona.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

# Puerto de métricas (Prometheus) de los tres procesos, separado del puerto de la API (T039).
# Solo lo alcanza el scraper de la plataforma de observabilidad; nunca un frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recomendaciones-metrics-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [recomendaciones-api, recomendaciones-worker, recomendaciones-transformer]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              purpose: observability
      ports:
        - protocol: TCP
          port: 9100

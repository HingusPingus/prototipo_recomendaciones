[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "recomendaciones"
version = "0.1.0"
description = "RecoMe · Servicio de recomendaciones híbridas precomputadas (feature 001)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "aio-pika>=9.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "testcontainers[postgres,redis,rabbitmq]>=4.7",
    "openapi-spec-validator>=0.7",
    "pytest-cov>=5",
    "ruff==0.16.9",  # fijado: el conjunto de reglas por defecto cambia entre versiones y el lint es gate (T067)
]

[project.scripts]
reco-api = "recomendaciones.api.main:run"
reco-worker = "recomendaciones.worker.main:run"
reco-transformer = "recomendaciones.transformer.main:run"
reco-batch = "recomendaciones.batch.main:run"
reco-demo = "recomendaciones.demo.main:run"  # solo demo: api-general simulado (guía en docs/demo.md)

[tool.hatch.build.targets.wheel]
packages = ["src/recomendaciones"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requiere contenedores reales (testcontainers)",
    "performance: prueba de carga bajo demanda, no gate de CI (T050)",
]
addopts = "-m 'not performance'"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# Códigos que el código cita en `noqa` con su motivo, aunque la regla no esté activa: se conservan (T067).
external = ["ANN", "BLE", "SLF", "PLR0913", "N802", "E731"]

[tool.ruff.lint.flake8-bugbear]
# Los parámetros de FastAPI se declaran con `Query(...)` como valor por defecto: es la forma idiomática.
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body", "fastapi.Depends"]

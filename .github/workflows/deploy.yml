# Despliegue continuo a Dokploy (guía: recomendaciones/docs/despliegue.md).
#
# Arranca cuando el workflow `ci` termina sobre un push a `main`, y solo si terminó en verde: así ningún gate se
# saltea para desplegar (Principio VI: un contract test roto bloquea el deploy). Construye la imagen del commit
# que pasó el CI, la publica en ghcr.io y le pide a Dokploy que redespliegue las Applications `reco-api` y
# `reco-worker`, que la descargan.
#
# GitHub solo dispara `workflow_run` si este archivo está en la rama por defecto (`main`). Las condiciones `if:` de
# este archivo no debilitan ningún gate: los gates viven en `ci.yml`, y `tests/unit/test_deploy.py` fija estas.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Un deploy a medias es peor que uno demorado: se encolan, no se cancelan.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Es la imagen que descargan las Applications de Dokploy (lo verifica tests/unit/test_deploy.py).
  IMAGE: ghcr.io/hinguspingus/recomendaciones

jobs:
  image:
    name: imagen en ghcr.io
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: recomendaciones
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dokploy:
    name: redespliegue en Dokploy
    runs-on: ubuntu-latest
    needs: image
    steps:
      - name: pedir el deploy de las Applications
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_API_APPLICATION_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
          DOKPLOY_WORKER_APPLICATION_ID: ${{ secrets.DOKPLOY_WORKER_APPLICATION_ID }}
        run: |
          : "${DOKPLOY_URL:?falta el secret DOKPLOY_URL}" "${DOKPLOY_API_KEY:?falta el secret DOKPLOY_API_KEY}"
          : "${DOKPLOY_API_APPLICATION_ID:?falta el secret DOKPLOY_API_APPLICATION_ID}"
          : "${DOKPLOY_WORKER_APPLICATION_ID:?falta el secret DOKPLOY_WORKER_APPLICATION_ID}"
          deploy() {
            curl --fail-with-body --silent --show-error --max-time 60 \
              -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"applicationId\": \"$1\"}"
          }
          # Primero la API, que aplica las migraciones al arrancar (reco-api-con-migraciones); después el worker.
          deploy "${DOKPLOY_API_APPLICATION_ID}"
          deploy "${DOKPLOY_WORKER_APPLICATION_ID}"
